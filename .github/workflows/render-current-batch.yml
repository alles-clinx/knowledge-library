name: Render Current Batch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render current batch
        run: python scripts/render_current_batch.py
      - name: Commit rendered pages
        run: |
          git add docs/library docs/assets/live-search.json
          if git diff --cached --quiet; then
            echo "No rendered changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Render current batch article pages"
          git push
