name: Interaction Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interaction-smoke-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build production site
        run: |
          python -m pip install pillow
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          python scripts/build_hostinger_production.py /tmp/knowledge-publish
          mkdir -p /tmp/acx-web/knowledge
          cp -a /tmp/knowledge-publish/. /tmp/acx-web/knowledge/
      - name: Install Chromium smoke-test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local production server
        run: |
          python -m http.server 4173 --directory /tmp/acx-web >/tmp/acx-http.log 2>&1 &
          echo $! > /tmp/acx-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/knowledge/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/acx-http.log
          exit 1
      - name: Run interaction smoke test
        env:
          BASE_URL: http://127.0.0.1:4173/knowledge/
        run: node tests/interaction-smoke.mjs
      - name: Run PWA smoke test
        env:
          BASE_URL: http://127.0.0.1:4173/knowledge/
        run: node tests/pwa-smoke.mjs
