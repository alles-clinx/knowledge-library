<!DOCTYPE html>

<html lang="hi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<script>document.documentElement.classList.add('acx-js');</script>
<title>पेशेवर सफाई क्या है? | Alle's ClinX</title>
<meta content="जानें कि पेशेवर सफाई क्या है, इसमें किन कार्यों और नियंत्रणों की जरूरत होती है, और नियमित सफाई को एक भरोसेमंद सुविधा-प्रबंधन प्रणाली कैसे बनाया जाता है।" name="description"/>
<style>
:root{
  --black:#000;
  --white:#fff;
  --page:1280px;
  --reading-size:17px;
  --reading-leading:1.72;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--white);
  color:var(--black);
  font-family:Inter,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
a{color:inherit}
button{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}

.page{
  width:min(var(--page),calc(100% - 64px));
  margin:0 auto;
  padding:34px 0 110px;
}

/* ---------- top orientation ---------- */
.breadcrumb{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  margin:0 0 52px;
  font-size:13px;
  line-height:1.35;
}
.breadcrumb a{
  text-underline-offset:3px;
  text-decoration-thickness:1px;
}
.breadcrumb .current{font-weight:650}

/* ---------- full-width title ---------- */
.article-head{
  max-width:1060px;
}
.article-head h1{
  margin:0;
  max-width:1040px;
  font-size:clamp(52px,6.6vw,92px);
  line-height:.96;
  letter-spacing:-.055em;
  font-weight:600;
}
.deck{
  max-width:820px;
  margin:27px 0 0;
  font-size:20px;
  line-height:1.5;
  letter-spacing:-.012em;
}
.source-note{
  max-width:820px;
  margin:17px 0 0;
  font-size:13px;
  line-height:1.5;
}
.source-note a{
  text-underline-offset:3px;
}

/* ---------- two-section reading system ---------- */
.reading-layout{
  display:grid;
  grid-template-columns:minmax(0,760px) minmax(250px,300px);
  justify-content:space-between;
  gap:72px;
  align-items:start;
  margin-top:74px;
}

/* ---------- article ---------- */
.article{
  min-width:0;
  font-size:var(--reading-size);
  line-height:var(--reading-leading);
}
.article section{
  scroll-margin-top:28px;
  margin-top:68px;
}
.article section:first-child{margin-top:0}
.article h2{
  margin:0 0 20px;
  font-size:clamp(29px,3vw,38px);
  line-height:1.08;
  letter-spacing:-.038em;
  font-weight:650;
}
.article h3{
  margin:34px 0 12px;
  font-size:20px;
  line-height:1.22;
  letter-spacing:-.018em;
  font-weight:700;
}
.article p{
  margin:0 0 20px;
}
.article ul{
  margin:0 0 22px;
  padding-left:1.25em;
}
.article li{
  margin:8px 0;
}
.article strong{font-weight:700}

.cite{
  display:inline-block;
  margin-left:2px;
  font-size:.67em;
  line-height:1;
  vertical-align:super;
  text-decoration:none;
  font-weight:700;
}
.cite:hover{text-decoration:underline}

.key-point{
  margin:30px 0;
  padding:0;
}
.key-point strong{
  display:block;
  margin-bottom:8px;
  font-size:14px;
}
.key-point p{
  margin:0;
  font-size:.94em;
  line-height:1.62;
}

.data-table{
  width:100%;
  margin:28px 0;
  border-collapse:collapse;
  font-size:.9em;
}
.data-table th,
.data-table td{
  padding:14px 12px;
  text-align:left;
  vertical-align:top;
  border-bottom:1px solid var(--black);
}
.data-table thead th{
  border-top:2px solid var(--black);
  font-size:.76em;
  text-transform:uppercase;
  letter-spacing:.055em;
  font-weight:750;
}

.references{
  padding-top:4px;
}
.references ol{
  margin:0;
  padding-left:1.4em;
}
.references li{
  margin:0 0 18px;
  padding-left:4px;
  line-height:1.55;
}
.references .ref-title{
  font-weight:700;
}
.references .ref-url{
  display:block;
  margin-top:4px;
  overflow-wrap:anywhere;
  font-size:.84em;
  line-height:1.45;
}
.references .backref{
  margin-left:6px;
  text-decoration:none;
}

/* ---------- right rail ---------- */
.rail{
  position:sticky;
  top:24px;
  min-width:0;
}
.rail-section{
  padding:0;
  margin-bottom:34px;
}
.rail-section:last-child{
  margin-bottom:0;
}
.rail h2{
  margin:0 0 13px;
  font-size:12px;
  line-height:1.2;
  text-transform:uppercase;
  letter-spacing:.07em;
  font-weight:800;
}

/* tools */
.tools{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}
.tool-wrap{
  position:relative;
}
.tool{
  width:100%;
  min-height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:0 8px;
  border:1px solid var(--black);
  border-radius:7px;
  background:var(--white);
  color:var(--black);
  cursor:pointer;
  font-size:12px;
  font-weight:650;
}
.tool svg{
  width:15px;
  height:15px;
  flex:0 0 15px;
  stroke:currentColor;
}
.tool:hover,
.tool[aria-pressed="true"],
.tool[aria-expanded="true"]{
  background:var(--black);
  color:var(--white);
}
.tool:focus-visible,
.rail a:focus-visible,
.pop-action:focus-visible{
  outline:3px solid var(--black);
  outline-offset:3px;
}
.tool-status{
  min-height:18px;
  margin:8px 0 0;
  font-size:11px;
  line-height:1.4;
}

.popover{
  position:absolute;
  z-index:30;
  top:calc(100% + 7px);
  right:0;
  width:224px;
  padding:8px;
  border:1px solid var(--black);
  border-radius:8px;
  background:var(--white);
  box-shadow:4px 4px 0 var(--black);
}
.popover[hidden]{display:none}

.share-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}
.share-grid a,
.share-grid button{
  min-width:0;
  min-height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--black);
  border-radius:7px;
  background:var(--white);
  color:var(--black);
  cursor:pointer;
  text-decoration:none;
}
.share-grid a:hover,
.share-grid button:hover,
.share-grid a:focus-visible,
.share-grid button:focus-visible{
  background:var(--black);
  color:var(--white);
  outline:none;
}
.share-grid svg{
  width:18px;
  height:18px;
  stroke:currentColor;
}
.brand-logo{
  display:block;
  width:20px;
  height:20px;
  object-fit:contain;
  filter:none;
}
.share-grid a:hover .brand-logo,
.share-grid a:focus-visible .brand-logo{
  filter:invert(1);
}

.save-pop{
  width:232px;
}
.browser-save-list{
  display:flex;
  flex-direction:column;
  gap:4px;
}
.browser-save-action{
  width:100%;
  min-height:42px;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:12px;
  align-items:center;
  padding:0 10px;
  border:0;
  border-radius:6px;
  background:var(--white);
  color:var(--black);
  text-align:left;
  cursor:pointer;
}
.browser-save-action:hover,
.browser-save-action:focus-visible{
  background:var(--black);
  color:var(--white);
  outline:none;
}
.browser-save-action strong{
  font-size:13px;
  line-height:1.2;
}
.browser-save-action span{
  display:block;
  margin-top:2px;
  font-size:10px;
  line-height:1.25;
  font-weight:500;
}
.browser-shortcut{
  min-width:58px;
  padding:4px 6px;
  border:1px solid currentColor;
  border-radius:5px;
  text-align:center;
  font-size:10px;
  line-height:1;
  font-weight:750;
  white-space:nowrap;
}
.text-pop{
  width:170px;
}
.text-controls{
  display:grid;
  grid-template-columns:44px 1fr 44px;
  align-items:center;
  border:1px solid var(--black);
  border-radius:7px;
  overflow:hidden;
}
.text-controls button{
  min-height:42px;
  border:0;
  background:var(--white);
  color:var(--black);
  cursor:pointer;
  font-weight:750;
}
.text-controls button:first-child{border-right:1px solid var(--black)}
.text-controls button:last-child{border-left:1px solid var(--black)}
.text-controls button:hover{
  background:var(--black);
  color:var(--white);
}
.text-size-readout{
  text-align:center;
  font-size:12px;
  font-weight:700;
}

/* on-page topics */
.toc{
  display:flex;
  flex-direction:column;
  gap:2px;
}
.toc a{
  display:block;
  min-height:37px;
  padding:8px 9px;
  border-radius:6px;
  font-size:13px;
  line-height:1.3;
  text-decoration:none;
}
.toc a:hover,
.toc a.is-active{
  background:var(--black);
  color:var(--white);
}

/* suggestions */
.suggestions{
  display:flex;
  flex-direction:column;
}
.suggestion{
  display:block;
  padding:10px 0;
  text-decoration:none;
}
.suggestion:first-child{
  padding-top:0;
}
.suggestion strong{
  display:block;
  font-size:14px;
  line-height:1.3;
}
.suggestion span{
  display:block;
  margin-top:4px;
  font-size:12px;
  line-height:1.45;
}
.suggestion:hover strong{text-decoration:underline}


/* ---------- hook sidebar ---------- */
.hook-sidebar{
  position:relative;
}
.hook-list{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.hook-item{
  position:relative;
  z-index:2;
  min-height:34px;
  display:flex;
  align-items:center;
  width:100%;
  padding:7px 8px 7px 22px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:var(--black);
  opacity:.5;
  text-align:left;
  text-decoration:none;
  cursor:pointer;
  font-size:13px;
  line-height:1.25;
  transition:opacity .16s ease,background-color .16s ease;
}
.hook-item:hover,
.hook-item:focus-visible{
  opacity:.8;
}
.hook-item.is-active{
  opacity:1;
  font-weight:700;
}
.hook-item:focus-visible{
  outline:2px solid var(--black);
  outline-offset:2px;
}
.hook-rail{
  position:absolute;
  inset:0 auto auto 2px;
  width:12px;
  height:100%;
  pointer-events:none;
  z-index:1;
}
.hook-rail-segment{
  position:absolute;
  left:0;
  top:0;
  width:1px;
  background:currentColor;
  transform-origin:top;
  transition:top .22s cubic-bezier(.22,1,.36,1),height .22s cubic-bezier(.22,1,.36,1),opacity .16s ease;
}
.hook-rail-segment.is-dashed{
  width:1px;
  background-image:repeating-linear-gradient(to bottom,currentColor 0 2px,transparent 2px 4px);
  background-color:transparent;
}
.hook-rail-corner{
  position:absolute;
  left:0;
  width:12px;
  height:7px;
  overflow:visible;
  transition:top .22s cubic-bezier(.22,1,.36,1),opacity .16s ease;
}
.hook-rail-corner path{
  fill:none;
  stroke:currentColor;
  stroke-width:1;
}
.hook-rail.active{
  color:var(--black);
  opacity:1;
}
.hook-rail.hover{
  color:var(--black);
  opacity:.28;
}
.hook-rail.hover[hidden]{display:none}

/* ---------- mobile rail ---------- */
.mobile-rail{
  display:none;
}

/* ---------- responsive engineering ---------- */
@media(max-width:980px){
  .reading-layout{
    grid-template-columns:minmax(0,1fr) 260px;
    gap:42px;
  }
}

@media(max-width:900px){
  .page{
    width:min(var(--page),calc(100% - 34px));
    padding-top:26px;
    padding-bottom:74px;
  }
  .breadcrumb{
    margin-bottom:38px;
    font-size:12px;
  }
  .article-head h1{
    font-size:clamp(42px,11vw,62px);
    line-height:.98;
    letter-spacing:-.048em;
  }
  .deck{
    margin-top:20px;
    font-size:17px;
    line-height:1.52;
  }
  .source-note{font-size:12px}

  .reading-layout{
    display:flex;
    flex-direction:column;
    margin-top:38px;
  }
  .mobile-rail{
    display:block;
    order:0;
    margin-bottom:28px;
  }
  .article{order:1}
  .rail{
    order:2;
    position:static;
    margin-top:58px;
  }
  .rail .rail-section:nth-child(-n+2){display:none}
  .rail .rail-section:last-child{
    display:block;
    padding-top:28px;
    border-top:1px solid var(--black);
  }
  .mobile-tools{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-bottom:8px;
  }
  .mobile-rail details{
    border:1px solid var(--black);
    border-radius:8px;
    overflow:hidden;
  }
  .mobile-rail summary{
    min-height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    list-style:none;
    cursor:pointer;
    font-size:14px;
    font-weight:700;
  }
  .mobile-rail summary::-webkit-details-marker{display:none}
  .mobile-rail summary::after{
    content:"+";
    font-size:20px;
    font-weight:400;
  }
  .mobile-rail details[open] summary::after{content:"−"}
  .mobile-panel{
    padding:8px;
    border-top:1px solid var(--black);
  }
  .mobile-panel .toc a{
    min-height:44px;
    padding:11px 8px;
  }

  .article{
    font-size:var(--reading-size);
  }
  .article section{
    margin-top:54px;
  }
  .article h2{
    font-size:30px;
  }
  .data-table{
    display:block;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
}

@media(max-width:390px){
  .page{width:calc(100% - 24px)}
  .article-head h1{font-size:40px}
  .deck{font-size:16px}
  .mobile-tools{grid-template-columns:repeat(3,1fr)}
  .tool span{font-size:11px}
  .popover{width:min(224px,calc(100vw - 32px))}
}

/* ---------- print ---------- */
@media print{
  .breadcrumb,
  .rail,
  .mobile-rail{display:none!important}
  .page{width:100%;padding:0}
  .reading-layout{display:block;margin-top:40px}
  .article{max-width:none;font-size:11pt}
  a{color:#000}
}

/* ---------- reduced motion ---------- */
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important}
}

.sr-only{
  position:absolute!important;
  width:1px!important;
  height:1px!important;
  padding:0!important;
  margin:-1px!important;
  overflow:hidden!important;
  clip:rect(0,0,0,0)!important;
  white-space:nowrap!important;
  border:0!important;
}

/* ---------- floating scroll progress ---------- */
.scroll-progress{
  position:fixed;
  left:50%;
  bottom:22px;
  z-index:80;
  transform:translateX(-50%);
  width:min(320px,calc(100vw - 28px));
  pointer-events:none;
}
.scroll-progress-shell{
  pointer-events:auto;
  margin-left:auto;
  margin-right:auto;
  width:max-content;
  max-width:100%;
  border:1px solid var(--black);
  border-radius:999px;
  background:var(--white);
  color:var(--black);
  box-shadow:4px 4px 0 var(--black);
  overflow:hidden;
  transition:
    width .28s cubic-bezier(.22,1,.36,1),
    border-radius .28s cubic-bezier(.22,1,.36,1),
    box-shadow .18s ease;
}
.scroll-progress.is-open .scroll-progress-shell{
  width:100%;
  border-radius:18px;
}
.scroll-progress-toggle{
  min-height:44px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:6px 14px 6px 8px;
  border:0;
  background:var(--white);
  color:var(--black);
  cursor:pointer;
}
.scroll-progress-toggle:hover{
  background:var(--black);
  color:var(--white);
}
.scroll-ring{
  width:28px;
  height:28px;
  flex:0 0 28px;
  transform:rotate(-90deg);
}
.scroll-ring-track,
.scroll-ring-value{
  fill:none;
  stroke:currentColor;
  stroke-width:2;
}
.scroll-ring-track{opacity:.18}
.scroll-ring-value{
  stroke-linecap:round;
  stroke-dasharray:62.832;
  stroke-dashoffset:62.832;
  transition:stroke-dashoffset .08s linear;
}
.scroll-progress-label{
  max-width:220px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:13px;
  line-height:1;
  font-weight:700;
  text-align:left;
}
.scroll-progress-list{
  display:none;
  padding:6px;
  border-top:1px solid var(--black);
}
.scroll-progress.is-open .scroll-progress-list{
  display:block;
}
.scroll-progress-item{
  width:100%;
  min-height:40px;
  display:grid;
  grid-template-columns:8px minmax(0,1fr);
  gap:10px;
  align-items:center;
  padding:7px 10px;
  border:0;
  border-radius:10px;
  background:var(--white);
  color:var(--black);
  cursor:pointer;
  text-align:left;
  font-size:13px;
  line-height:1.25;
}
.scroll-progress-item:hover,
.scroll-progress-item.is-active{
  background:var(--black);
  color:var(--white);
}
.scroll-progress-dot{
  width:6px;
  height:6px;
  border:1px solid currentColor;
  border-radius:50%;
}
.scroll-progress-item.is-active .scroll-progress-dot{
  background:currentColor;
}
.scroll-progress-toggle:focus-visible,
.scroll-progress-item:focus-visible{
  outline:3px solid var(--black);
  outline-offset:3px;
}
@media(max-width:900px){
  .scroll-progress{
    bottom:max(14px,env(safe-area-inset-bottom));
    width:min(360px,calc(100vw - 24px));
  }
  .scroll-progress-shell{
    box-shadow:3px 3px 0 var(--black);
  }
  .scroll-progress.is-open .scroll-progress-shell{
    max-height:min(70vh,560px);
    overflow:auto;
  }
  .scroll-progress-label{max-width:240px}
}
@media(max-width:390px){
  .scroll-progress-label{max-width:210px}
}
@media print{
  .scroll-progress{display:none!important}
}
@media(prefers-reduced-motion:reduce){
  .scroll-progress-shell,
  .scroll-ring-value{transition:none!important}
}


/* ---------- mobile interaction engineering v14 ---------- */
@media(max-width:900px){
  body{
    overflow-x:hidden;
  }

  .mobile-rail{
    margin:0 0 36px;
  }

  /* The floating progress control already owns section navigation on phones,
     so the duplicate mobile "Article topics" disclosure is removed. */
  .acx-js .mobile-rail > details{
    display:none;
  }

  .mobile-tools.tools{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:0;
    border:1px solid var(--black);
    border-radius:8px;
    overflow:visible;
  }

  .mobile-tools .tool-wrap{
    min-width:0;
  }

  .mobile-tools .tool{
    min-height:48px;
    border:0;
    border-radius:0;
    padding:0 8px;
    font-size:12px;
  }

  .mobile-tools .tool-wrap + .tool-wrap > .tool{
    border-left:1px solid var(--black);
  }

  .mobile-tools .tool svg{
    width:14px;
    height:14px;
    flex-basis:14px;
  }

  /* Menus become bottom sheets instead of tiny anchored popovers.
     This prevents clipping and thumb-reach problems on 320–430px screens. */
  .mobile-tools .popover{
    position:fixed;
    left:12px;
    right:12px;
    top:auto;
    bottom:76px;
    width:auto;
    max-width:none;
    max-height:min(66vh,520px);
    overflow:auto;
    padding:10px;
    border:1px solid var(--black);
    border-radius:12px;
    background:var(--white);
    box-shadow:4px 4px 0 var(--black);
  }

  .mobile-tools .share-grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:7px;
  }

  .mobile-tools .share-grid a,
  .mobile-tools .share-grid button{
    min-height:52px;
  }

  .mobile-tools .save-pop,
  .mobile-tools .text-pop{
    width:auto;
  }

  .mobile-tools .browser-save-action{
    min-height:50px;
    padding:7px 10px;
  }

  .mobile-tools .text-controls{
    grid-template-columns:52px minmax(0,1fr) 52px;
  }

  .mobile-tools .text-controls button{
    min-height:50px;
  }

  .article{
    font-size:var(--reading-size);
    line-height:1.68;
  }

  .article p{
    margin-bottom:18px;
  }

  .article h2{
    margin-bottom:16px;
  }

  .article h3{
    margin-top:30px;
  }

  .references li{
    margin-bottom:22px;
  }

  .references .ref-url{
    font-size:.8em;
    line-height:1.5;
  }

  .cite{
    padding:2px 1px;
  }

  .scroll-progress{
    bottom:max(12px,env(safe-area-inset-bottom));
  }

  html.has-tool-popover .scroll-progress{
    opacity:0;
    pointer-events:none;
    transform:translate(-50%,8px);
  }
}

@media(max-width:390px){
  .page{
    width:calc(100% - 24px);
  }

  .article-head h1{
    font-size:clamp(36px,11.2vw,43px);
    line-height:1;
  }

  .deck{
    font-size:16px;
  }

  .source-note{
    line-height:1.45;
  }

  .article{
    --reading-size:16px;
  }
