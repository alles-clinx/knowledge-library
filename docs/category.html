<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Category | Alle's ClinX Knowledge</title><style>:root{--ink:#111;--text:#3a3a3c;--muted:#737373;--line:#e7e7e7;--soft:#f7f7f7;--page:1120px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}a{color:inherit;text-decoration:none}button,input{font:inherit}.page{width:min(var(--page),calc(100% - 64px));margin:0 auto;padding:46px 0 112px}.breadcrumb{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:0 0 52px;color:var(--muted);font-size:12px}.hero{max-width:800px}h1{margin:0;font-size:clamp(44px,5vw,64px);line-height:1;letter-spacing:-.045em;font-weight:700}.hero p{max-width:700px;margin:20px 0 0;color:var(--text);font-size:19px;line-height:1.55;letter-spacing:-.012em}.search{position:relative;max-width:720px;margin-top:40px}.search svg{position:absolute;left:18px;top:50%;width:19px;height:19px;transform:translateY(-50%);fill:none;stroke:#6f6f73;stroke-width:1.7;stroke-linecap:round;pointer-events:none}.search input{width:100%;height:58px;padding:0 18px 0 50px;border:1px solid #cfcfcf;border-radius:12px;outline:none;background:#fff;color:var(--ink);font-size:16px}.search input:focus{border-color:#111;box-shadow:0 0 0 3px rgba(0,0,0,.055)}.library{margin-top:88px}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;padding-bottom:18px;border-bottom:1px solid var(--line)}h2{margin:0;font-size:28px;line-height:1.15;letter-spacing:-.032em;font-weight:680}.section-head p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}.grid{display:grid;grid-template-columns:1fr 1fr;column-gap:56px}.row{min-width:0;display:block;padding:24px 0 26px;border-bottom:1px solid var(--line) dge areas</a></div></main><script>const D={"cleaning-housekeeping":"Everyday cleaning methods, routines, schedules and housekeeping workflows.","floor-surface-care":"Care, maintenance and troubleshooting for floors and other facility surfaces.","washroom-hygiene":"Routine cleaning, odour control, sanitary fittings and washroom maintenance.","kitchen-food-service":"Cleaning and hygiene guidance for kitchens, food-contact areas and dishwashing.","laundry-fabric-care":"Washing, dosing, stain care and practical guidance for fabrics and linen.","disinfection-infection-prevention":"Disinfection principles, contact time and infection-prevention cleaning practices.","hand-hygiene":"Handwashing, hand rubs, dispensers and practical hygiene guidance.","cleaning-equipment-systems":"Machines, tools, dosing systems and equipment used in professional cleaning.","cleaning-chemistry":"pH, acids, alkalis, surfactants, dilution and the chemistry behind cleaning.","safety-compliance":"SDS, labels, PPE, chemical handling, storage and workplace documentation.","facility-hygiene-management":"Planning, inspection, auditing, training and management of cleaning programs.","facility-guides":"Practical guidance for different facility types and operating environments.","alles-clinx":"Product selection, digital tools, documentation and Alle's ClinX support resources."};const P=new URLSearchParams(location.search),slug=P.get('slug');let d,cat,subs=[];const q=document.getElementById('q'),list=document.getElementById('list'),empty=document.getElementById('empty');function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){const t=q.value.trim().toLowerCase();const x=subs.filter(s=>{const arts=d.articles.filter(a=>a.category_slug===slug&&a.subcategory_slug===s.slug);return !t||(s.name+' '+arts.map(a=>a.title).join(' ')).toLowerCase().includes(t)});list.innerHTML=x.map(s=>{const n=d.articles.filter(a=>a.category_slug===slug&&a.subcategory_slug===s.slug).length;return '<a class="row" href="subcategory.html?category='+encodeURIComponent(slug)+'&slug='+encodeURIComponent(s.slug)+'"><strong>'+esc(s.name)+'</strong><span>'+n+' '+(n===1?'guide':'guides')+' in this topic.</span></a>'}).join('');empty.classList.toggle('show',!x.length)}fetch('../taxonomy/canonical-structure.json').then(r=>r.json()).then(x=>{d=x;cat=d.taxonomy_terms.find(t=>t.type==='category'&&t.slug===slug);if(!cat)throw Error('Category not found');subs=d.taxonomy_terms.filter(t=>t.type==='subcategory'&&t.parent_term_id===cat.term_id);document.title=cat.name+" | Alle's ClinX Knowledge";document.getElementById('title').textContent=cat.name;document.getElementById('crumb').textContent=cat.name;document.getElementById('intro').textContent=D[slug]||'Explore practical guidance in this knowledge area.';document.getElementById('count').textContent=subs.length+' subcategories · '+d.articles.filter(a=>a.category_slug===slug).length+' guides';render()}).catch(e=>document.body.innerHTML='<main class="page">'+e.message+'</main>');q.addEventListener('input',render);</script></body></html>
