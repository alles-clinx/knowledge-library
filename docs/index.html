<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alle's ClinX Knowledge — Preview</title>
<style>
:root{--text:#111;--muted:#6b6b6b;--line:#e7e7e7;--bg:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1040px;margin:auto;padding:72px 28px 96px}
header{max-width:760px;margin-bottom:56px}
h1{font-size:clamp(42px,7vw,72px);line-height:1;letter-spacing:-.055em;margin:0 0 18px}
.lede{font-size:19px;line-height:1.55;color:#555;margin:0 0 30px}
.search{width:100%;height:54px;border:1px solid #cfcfcf;border-radius:0;padding:0 16px;font:inherit;font-size:16px;outline:none;background:#fff}
.search:focus{border-color:#111}
.lang{display:flex;gap:18px;margin-top:18px;font-size:14px}
.lang button{border:0;background:none;padding:0 0 6px;cursor:pointer;color:#777}
.lang button.active{color:#111;border-bottom:1px solid #111;font-weight:600}
.status{font-size:13px;color:#777;margin:28px 0 14px}
.list{border-top:1px solid var(--line)}
.row{display:block;text-decoration:none;color:inherit;padding:22px 0;border-bottom:1px solid var(--line)}
.row h2{font-size:19px;line-height:1.35;margin:0 0 6px;font-weight:650}
.row p{font-size:14px;line-height:1.55;color:var(--muted);margin:0;max-width:760px}
.empty{padding:28px 0;color:#777}
footer{margin-top:72px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:#777;line-height:1.6}
@media(max-width:560px){main{padding:42px 20px 72px}header{margin-bottom:42px}h1{font-size:42px}.lede{font-size:17px}.search{height:50px}.row{padding:18px 0}}
</style>
</head>
<body>
<main>
<header>
<h1>Alle's ClinX Knowledge</h1>
<p class="lede">Open knowledge for professional cleaning, hygiene, chemistry, safety, equipment and facility operations.</p>
<input id="q" class="search" type="search" placeholder="Search the knowledge library" autocomplete="off">
<div class="lang" aria-label="Language">
<button id="en" class="active" type="button">English</button>
<button id="hi" type="button">हिन्दी</button>
</div>
</header>
<div id="status" class="status">Loading library…</div>
<div id="list" class="list"></div>
<footer>
<strong>Alle's ClinX Open Knowledge</strong><br>
Free to read, download, share and reuse with attribution under CC BY 4.0.
</footer>
</main>
<script>
const INDEX='https://raw.githubusercontent.com/alles-clinx/knowledge-library/main/search/index.json';
let all=[],lang='en';
const q=document.getElementById('q'),list=document.getElementById('list'),status=document.getElementById('status');
function render(){
 const term=q.value.trim().toLowerCase();
 const rows=all.filter(r=>r.locale===(lang==='en'?'en':'hi-IN')).filter(r=>!term||[r.title,r.category,r.subcategory,r.excerpt].join(' ').toLowerCase().includes(term));
 status.textContent=rows.length+' article'+(rows.length===1?'':'s')+(term?' found':' in this preview');
 list.innerHTML=rows.length?rows.map(r=>`<a class="row" href="article.html?id=${encodeURIComponent(r.article_id)}&lang=${lang}"><h2>${esc(r.title)}</h2><p>${esc(r.excerpt)}</p></a>`).join(''):'<div class="empty">No matching articles.</div>';
}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
document.getElementById('en').onclick=()=>{lang='en';setTabs();render()};
document.getElementById('hi').onclick=()=>{lang='hi';setTabs();render()};
function setTabs(){document.getElementById('en').classList.toggle('active',lang==='en');document.getElementById('hi').classList.toggle('active',lang==='hi')}
q.addEventListener('input',render);
fetch(INDEX).then(r=>r.json()).then(x=>{all=x.records||[];render()}).catch(()=>{status.textContent='Preview index could not be loaded.'});
</script>
</body>
</html>
