<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Offline · Alle's ClinX Knowledge</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="./manifest.webmanifest">
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{width:min(680px,calc(100% - 40px));margin:0 auto;padding:clamp(72px,12vw,136px) 0}
small{display:block;color:#76767a;font-size:12px;font-weight:650;letter-spacing:.08em;text-transform:uppercase}
h1{margin:18px 0 0;font-size:clamp(38px,8vw,64px);line-height:1;letter-spacing:-.045em}
p{max-width:580px;margin:22px 0 0;color:#4b4b4f;font-size:17px;line-height:1.6}
a{display:inline-block;margin-top:32px;padding:12px 16px;border:1px solid #d8d8da;border-radius:9px;color:#111;text-decoration:none;font-weight:650}
a:focus-visible{outline:2px solid #111;outline-offset:3px}
</style>
</head>
<body>
<main>
  <small>Alle's ClinX Knowledge</small>
  <h1>You’re offline.</h1>
  <p>Guides you have already opened remain available. Reconnect to load Knowledge pages that have not been saved on this device yet.</p>
  <a href="./">Open Knowledge home</a>
</main>
</body>
</html>
