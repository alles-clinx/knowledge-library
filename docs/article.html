<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alle's ClinX Knowledge — Article Preview</title>
<style>
:root{--text:#111;--muted:#6b6b6b;--line:#e7e7e7;--measure:720px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Devanagari","Nirmala UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.page{max-width:1180px;margin:auto;padding:34px 30px 96px}
.back{font-size:13px;color:#777;text-decoration:none}.langs{display:flex;gap:20px;margin:34px 0 26px;border-bottom:1px solid var(--line);width:max-content}
.lang{padding:0 0 8px;text-decoration:none;color:#777;font-size:14px}.lang.active{color:#111;border-bottom:1px solid #111;font-weight:600}
header{max-width:900px}.meta{font-size:13px;color:#777;margin-bottom:14px}h1{font-size:clamp(44px,6vw,72px);line-height:1;letter-spacing:-.05em;margin:0 0 22px}
.deck{font-size:20px;line-height:1.55;color:#4b4b4b;max-width:780px;margin:0}
.layout{display:grid;grid-template-columns:minmax(0,var(--measure)) 240px;gap:92px;margin-top:62px;align-items:start}
.article{font-size:17px;line-height:1.75}.article h2{font-size:30px;line-height:1.2;letter-spacing:-.025em;margin:54px 0 16px}.article h2:first-child{margin-top:0}.article h3{font-size:21px;margin:34px 0 12px}.article p{margin:0 0 20px}.article li{margin:8px 0}.article a{color:inherit;text-underline-offset:3px}
.rail{position:sticky;top:28px;border-top:1px solid var(--line);padding-top:16px}.rail-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#888;margin-bottom:10px}.toc a{display:block;text-decoration:none;color:#777;font-size:14px;line-height:1.35;padding:7px 0;border-left:1px solid var(--line);padding-left:12px}.toc a:hover{color:#111}
.open{max-width:var(--measure);border-top:1px solid #111;margin-top:70px;padding-top:20px;font-size:13px;line-height:1.6;color:#666}.open strong{color:#111;display:block;margin-bottom:4px}
.loading{padding:80px 0;color:#777}
@media(max-width:820px){.page{padding:26px 22px 80px}.layout{display:block;margin-top:48px}.rail{display:none}h1{font-size:52px}}
@media(max-width:560px){h1{font-size:39px}.deck{font-size:18px}.article{font-size:16px}.article h2{font-size:25px}.page{padding-left:18px;padding-right:18px}}
</style>
</head>
<body>
<main class="page">
<a class="back" href="./">Knowledge preview</a>
<div class="langs"><a id="en" class="lang" href="#">English</a><a id="hi" class="lang" href="#">हिन्दी</a></div>
<div id="loading" class="loading">Loading article…</div>
<div id="content" hidden>
<header><div id="meta" class="meta"></div><h1 id="title"></h1><p id="deck" class="deck"></p></header>
<div class="layout">
<div><article id="article" class="article"></article><footer class="open"><strong>Alle's ClinX Open Knowledge</strong>Free to read, download, share, reuse and adapt with attribution under CC BY 4.0.</footer></div>
<aside class="rail"><div class="rail-title">On this page</div><nav id="toc" class="toc"></nav></aside>
</div>
</div>
</main>
<script>
const p=new URLSearchParams(location.search), id=p.get('id')||'ACX-KB-0001'; let lang=p.get('lang')==='hi'?'hi':'en';
const INDEX='https://raw.githubusercontent.com/alles-clinx/knowledge-library/main/search/index.json';
function pathFor(rec){return 'https://raw.githubusercontent.com/alles-clinx/knowledge-library/main/articles/'+rec.category_slug+'/'+id+'/'+(lang==='hi'?'hi':'en')+'.json'}
function setTab(){document.getElementById('en').classList.toggle('active',lang==='en');document.getElementById('hi').classList.toggle('active',lang==='hi')}
function switchLang(next){lang=next;history.replaceState(null,'','?id='+encodeURIComponent(id)+'&lang='+lang);load()}
document.getElementById('en').onclick=e=>{e.preventDefault();switchLang('en')};document.getElementById('hi').onclick=e=>{e.preventDefault();switchLang('hi')};
async function load(){
 setTab();document.getElementById('loading').hidden=false;document.getElementById('content').hidden=true;
 const idx=await fetch(INDEX).then(r=>r.json());
 const rec=idx.records.find(x=>x.article_id===id&&x.locale===(lang==='hi'?'hi-IN':'en'))||idx.records.find(x=>x.article_id===id&&x.locale==='en');
 if(!rec) throw Error('Article not found');
 const data=await fetch(pathFor(rec)).then(r=>{if(!r.ok) throw Error('Translation/source not available');return r.json()});
 document.documentElement.lang=lang==='hi'?'hi':'en';document.title=data.seo_title||data.title;
 document.getElementById('meta').textContent=data.category+' · '+data.subcategory;
 document.getElementById('title').textContent=data.title;document.getElementById('deck').textContent=data.excerpt;
 const art=document.getElementById('article');art.innerHTML=data.content_html;
 const toc=document.getElementById('toc');toc.innerHTML='';art.querySelectorAll('h2[id]').forEach(h=>{const a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;toc.appendChild(a)});
 document.getElementById('loading').hidden=true;document.getElementById('content').hidden=false;
}
load().catch(e=>{document.getElementById('loading').textContent=e.message});
</script>
</body>
</html>
